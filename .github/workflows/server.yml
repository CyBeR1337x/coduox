name: server

# Builds the 64-bit Linux dedicated server on every push to master and every
# pull request, with and without CD-key authorization. Pushing a tag such as
# v1.0 also publishes a release with both server packages attached.

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: linux-x86_64 (AUTH=${{ matrix.auth }})
    runs-on: ubuntu-latest
    # The x87 float model the project requires is tied to GCC on x86, so the
    # build uses one fixed GCC and C library instead of the runner's. The
    # official Debian image is pulled from the Amazon ECR Public mirror, which
    # does not apply Docker Hub's anonymous pull limit to shared runners.
    container: public.ecr.aws/docker/library/debian:12
    strategy:
      fail-fast: false
      matrix:
        auth: [0, 1]

    steps:
      - name: Install the toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates git zlib1g-dev

      - uses: actions/checkout@v4

      - name: Check the source policy
        run: make policy-check

      - name: Build
        run: make server64 AUTH=${{ matrix.auth }}

      - name: Package
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) label=$GITHUB_REF_NAME ;;
            *) label=$(printf '%s' "$GITHUB_SHA" | cut -c1-9) ;;
          esac
          case "${{ matrix.auth }}" in
            1) flavor=auth ;;
            *) flavor=noauth ;;
          esac
          mkdir -p .workbench/packages
          bash tools/linux/package-server.sh \
            ".workbench/build/server/linux-x86_64-$flavor/coduo_lnxded_recovered" \
            .workbench/build/game/linux-x86_64/game.mp.uo.x86_64.so \
            ".workbench/packages/package-${{ matrix.auth }}.tar.gz" \
            x86_64 "${{ matrix.auth }}" "$label" "$GITHUB_SHA"
          # The archive's top-level directory carries the release name.
          name=$(tar -tzf ".workbench/packages/package-${{ matrix.auth }}.tar.gz" | head -n 1 | cut -d/ -f1)
          mv ".workbench/packages/package-${{ matrix.auth }}.tar.gz" ".workbench/packages/$name.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: server-linux-x86_64-auth${{ matrix.auth }}
          path: .workbench/packages/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: server-linux-x86_64-*
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" coduox-server-linux-x86_64-*.tar.gz
          --repo "$GITHUB_REPOSITORY"
          --title "coduox $GITHUB_REF_NAME"
          --notes "64-bit Linux dedicated server. The -auth package checks CD keys with the authorize server; the other skips that check. Copy a package's contents into an existing Call of Duty: United Offensive installation. See CHANGELOG.md for what coduox adds to coduomp."
